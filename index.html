<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of building maintenance tools and reference pages.">
  <title>Maintenance Tools | Home</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; color: #1b293c; }
    header { background: #17365d; color: #fff; padding: 44px 24px; }
    .container { max-width: 840px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.4rem); }
    header p { margin: 0; color: #dbe6f5; }
    main { padding: 32px 24px 60px; }
    h2 { font-size: 1.2rem; margin-bottom: 16px; }
    .tools { display: grid; gap: 14px; }
    .tool { display: block; border: 1px solid #dbe3ee; border-radius: 12px; padding: 22px; text-decoration: none; background: white; color: inherit; box-shadow: 0 2px 8px #1834540a; transition: border-color .15s, transform .15s; }
    .tool:hover, .tool:focus-visible { border-color: #3171bb; transform: translateY(-1px); outline-offset: 3px; }
    .tool strong { display: block; color: #12519b; font-size: 1.08rem; margin-bottom: 7px; }
    .tool span { color: #556679; line-height: 1.55; }
    footer { padding: 0 24px 32px; font-size: .9rem; color: #68788b; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Maintenance Tools</h1>
      <p>Useful calculators, references, and building maintenance resources.</p>
    </div>
  </header>
  <main class="container">
    <h2>Available tools</h2>
    <nav class="tools" aria-label="Available tools">
      <!-- IMPORTANT: Change FS31_glycol_pressure.html to the EXACT name of your uploaded HTML file. -->
      <a class="tool" href="FS31_glycol_pressure.html">
        <strong>FS31 Glycol Pressure</strong>
        <span>Open the glycol system pressure reference/tool.</span>
      </a>

      <!-- To add another tool later, copy the three lines below, remove the comment markers, and edit the name and file:
      <a class="tool" href="another-tool.html">
        <strong>Another Tool</strong>
        <span>Short description of the tool.</span>
      </a>
      -->
    </nav>
  </main>
  <footer class="container">More tools will be added over time.</footer>
</body>
</html>
